<svg width="480" height="480" viewBox="0 0 480 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Cosmic Void -->
    <radialGradient id="portal-void" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A0312" />
      <stop offset="70%" stop-color="#08020F" />
      <stop offset="100%" stop-color="#010005" />
    </radialGradient>

    <!-- 3D Suit Spherical Shading Gradient -->
    <radialGradient id="suit-radial" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FF1A53" />
      <stop offset="55%" stop-color="#D60036" />
      <stop offset="85%" stop-color="#800020" />
      <stop offset="100%" stop-color="#2B000B" />
    </radialGradient>

    <!-- Glowing Spider Eyes Filter -->
    <filter id="eye-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Three.js Quantum Particle Dot Pattern Overlay -->
    <pattern id="threejs-dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.1" fill="#00F0FF" opacity="0.32" />
    </pattern>

    <linearGradient id="eye-fill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E0F7FA" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
  </defs>

  <!-- Deep Circular Outer Frame -->
  <circle cx="240" cy="240" r="230" fill="url(#portal-void)" stroke="#FF0044" stroke-width="2" stroke-opacity="0.75" />

  <!-- 3D Gyroscope Particle Web Orbitals (Three.js Style Kinetic Rotation) -->
  <g fill="none">
    <ellipse cx="240" cy="240" rx="220" ry="94" stroke="#FF0044" stroke-width="1.8" stroke-dasharray="6 8" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0 240 240" to="360 240 240" dur="18s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="240" cy="240" rx="220" ry="94" stroke="#00F0FF" stroke-width="1.8" stroke-dasharray="8 6" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="60 240 240" to="420 240 240" dur="22s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="240" cy="240" rx="220" ry="94" stroke="#9D00FF" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="120 240 240" to="480 240 240" dur="16s" repeatCount="indefinite" />
    </ellipse>
  </g>

  <!-- SPIDER-MAN HEAD CONTOUR (Iconic Tapered Mask) -->
  <g id="spiderman-mask">
    <!-- Mask Base Path -->
    <path d="M 240 70 
             C 335 70, 365 145, 360 235 
             C 355 315, 290 385, 240 405 
             C 190 385, 125 315, 120 235 
             C 115 145, 145 70, 240 70 Z" 
          fill="url(#suit-radial)" stroke="#FF0044" stroke-width="2" />

    <!-- Spider-Man Web Lattice Across Mask -->
    <!-- Radial Web Lines Originating From Center of Bridge of Nose (240, 240) -->
    <g stroke="#120108" stroke-width="1.8" opacity="0.75">
      <line x1="240" y1="240" x2="240" y2="70" />
      <line x1="240" y1="240" x2="280" y2="76" />
      <line x1="240" y1="240" x2="320" y2="95" />
      <line x1="240" y1="240" x2="350" y2="135" />
      <line x1="240" y1="240" x2="360" y2="185" />
      <line x1="240" y1="240" x2="360" y2="245" />
      <line x1="240" y1="240" x2="345" y2="305" />
      <line x1="240" y1="240" x2="310" y2="355" />
      <line x1="240" y1="240" x2="270" y2="390" />
      <line x1="240" y1="240" x2="240" y2="405" />
      <!-- Left side radial spokes -->
      <line x1="240" y1="240" x2="200" y2="76" />
      <line x1="240" y1="240" x2="160" y2="95" />
      <line x1="240" y1="240" x2="130" y2="135" />
      <line x1="240" y1="240" x2="120" y2="185" />
      <line x1="240" y1="240" x2="120" y2="245" />
      <line x1="240" y1="240" x2="135" y2="305" />
      <line x1="240" y1="240" x2="170" y2="355" />
      <line x1="240" y1="240" x2="210" y2="390" />
    </g>

    <!-- Concentric Web Loop Arcs (Scalloped Webs) -->
    <g fill="none" stroke="#120108" stroke-width="1.8" opacity="0.75">
      <!-- Forehead Loops -->
      <path d="M 215 110 Q 240 120 265 110" />
      <path d="M 195 140 Q 240 155 285 140" />
      <path d="M 175 175 Q 240 195 305 175" />
      <path d="M 155 210 Q 240 230 325 210" />
      
      <!-- Lower Face Loops -->
      <path d="M 185 295 Q 240 280 295 295" />
      <path d="M 195 330 Q 240 315 285 330" />
      <path d="M 210 365 Q 240 350 270 365" />
    </g>

    <!-- Three.js Quantum Particle Dots Matrix Overlay (Giving it the authentic WebGL particle cloud feel) -->
    <path d="M 240 70 
             C 335 70, 365 145, 360 235 
             C 355 315, 290 385, 240 405 
             C 190 385, 125 315, 120 235 
             C 115 145, 145 70, 240 70 Z" 
          fill="url(#threejs-dots)" />

    <!-- ======================================================== -->
    <!-- ICONIC SPIDER-MAN EYES (LARGE, ANGLED, BOLD & GLOWING)    -->
    <!-- ======================================================== -->

    <!-- RIGHT EYE -->
    <g>
      <!-- Thick Bold Black Frame / Bezel -->
      <path d="M 252 235 
               C 275 225, 335 175, 350 148 
               C 353 158, 335 240, 310 265 
               C 285 288, 258 245, 252 235 Z" 
            fill="#090104" stroke="#000000" stroke-width="2" />
      
      <!-- Inner Glowing White/Cyan Lens with High-Intensity Bloom -->
      <path d="M 258 232 
               C 278 222, 328 178, 342 155 
               C 340 170, 326 235, 305 256 
               C 285 275, 264 240, 258 232 Z" 
            fill="url(#eye-fill-grad)" filter="url(#eye-glow)" />

      <!-- Subtle Cyber Scanline on Right Eye -->
      <path d="M 265 225 L 335 168" stroke="#00F0FF" stroke-width="1.2" opacity="0.8" />
    </g>

    <!-- LEFT EYE -->
    <g>
      <!-- Thick Bold Black Frame / Bezel -->
      <path d="M 228 235 
               C 205 225, 145 175, 130 148 
               C 127 158, 145 240, 170 265 
               C 195 288, 222 245, 228 235 Z" 
            fill="#090104" stroke="#000000" stroke-width="2" />
      
      <!-- Inner Glowing White/Cyan Lens with High-Intensity Bloom -->
      <path d="M 222 232 
               C 202 222, 152 178, 138 155 
               C 140 170, 154 235, 175 256 
               C 195 275, 216 240, 222 232 Z" 
            fill="url(#eye-fill-grad)" filter="url(#eye-glow)" />

      <!-- Subtle Cyber Scanline on Left Eye -->
      <path d="M 215 225 L 145 168" stroke="#00F0FF" stroke-width="1.2" opacity="0.8" />
    </g>
  </g>

  <!-- Animated Laser Scanline Sweep (HUD Telemetry) -->
  <line x1="60" y1="240" x2="420" y2="240" stroke="#00F0FF" stroke-width="2" opacity="0.75" filter="url(#eye-glow)">
    <animate attributeName="y1" values="50;430;50" dur="3.6s" repeatCount="indefinite" />
    <animate attributeName="y2" values="50;430;50" dur="3.6s" repeatCount="indefinite" />
  </line>

  <!-- HUD Corner Markers -->
  <g stroke="#00F0FF" stroke-width="1.8" opacity="0.85">
    <path d="M 85 85 L 68 85 L 68 102" fill="none" />
    <path d="M 395 85 L 412 85 L 412 102" fill="none" />
    <path d="M 68 378 L 68 395 L 85 395" fill="none" />
    <path d="M 412 378 L 412 395 L 395 395" fill="none" />
  </g>

  <!-- Spider-Verse Telemetry Badges -->
  <g font-family="'JetBrains Mono', system-ui, sans-serif" font-size="9.5" font-weight="800" letter-spacing="2">
    <text x="70" y="55" fill="#00F0FF" opacity="0.9">● THREE.JS MATRIX</text>
    <text x="300" y="55" fill="#FF0044" opacity="0.9">SPIDER-MAN ●</text>
    <text x="175" y="445" fill="#9D00FF" opacity="0.9">EARTH-616 // ACTIVE</text>
  </g>
</svg>