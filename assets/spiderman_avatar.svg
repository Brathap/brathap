<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Circular Avatar Clip -->
    <clipPath id="circle-clip">
      <circle cx="200" cy="200" r="145" />
    </clipPath>

    <!-- Outer Portal Dark Realm -->
    <radialGradient id="portal-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E0412" />
      <stop offset="60%" stop-color="#0E0318" />
      <stop offset="90%" stop-color="#05020A" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Neon Rim Gradient -->
    <linearGradient id="spider-neon-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0044" />
      <stop offset="50%" stop-color="#8A00FF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Intense Hologram Glow Filters -->
    <filter id="hologram-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="eye-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="eye-blur" />
      <feMerge>
        <feMergeNode in="eye-blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Outer Portal Frame -->
  <circle cx="200" cy="200" r="195" fill="url(#portal-bg)" stroke="url(#spider-neon-rim)" stroke-width="2.5" filter="url(#hologram-glow)" />

  <!-- 3D Perspective Wireframe Web Rings (Spider-Sense Gyroscope) -->
  <g opacity="0.5" stroke="#FF0044" stroke-width="1.2" fill="none">
    <ellipse cx="200" cy="200" rx="175" ry="175" stroke="#00F0FF" stroke-opacity="0.35" stroke-dasharray="10 14" />
    <ellipse cx="200" cy="200" rx="165" ry="75" stroke="#FF0044" stroke-opacity="0.6" stroke-dasharray="6 8">
      <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="20s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="200" cy="200" rx="165" ry="75" stroke="#00F0FF" stroke-opacity="0.5" stroke-dasharray="8 6">
      <animateTransform attributeName="transform" type="rotate" from="60 200 200" to="420 200 200" dur="25s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="200" cy="200" rx="165" ry="75" stroke="#8A00FF" stroke-opacity="0.45" stroke-dasharray="4 6">
      <animateTransform attributeName="transform" type="rotate" from="120 200 200" to="480 200 200" dur="18s" repeatCount="indefinite" />
    </ellipse>
  </g>

  <!-- Central Radial Cyber-Web Strands Behind Avatar -->
  <g stroke="#FF0044" stroke-opacity="0.25" stroke-width="1">
    <line x1="200" y1="200" x2="200" y2="25" />
    <line x1="200" y1="200" x2="325" y2="75" />
    <line x1="200" y1="200" x2="375" y2="200" />
    <line x1="200" y1="200" x2="325" y2="325" />
    <line x1="200" y1="200" x2="200" y2="375" />
    <line x1="200" y1="200" x2="75" y2="325" />
    <line x1="200" y1="200" x2="25" y2="200" />
    <line x1="200" y1="200" x2="75" y2="75" />
  </g>

  <!-- REVEALED USER FACE (Clipped to Circle with Cyber Neon Border) -->
  <g clip-path="url(#circle-clip)">
    <!-- Base Image -->
    <image href="./avatar.png" x="55" y="55" width="290" height="290" preserveAspectRatio="xMidYMid slice" />
    <!-- Cyber Vignette Overlay -->
    <circle cx="200" cy="200" r="145" fill="none" stroke="#FF0044" stroke-width="6" opacity="0.4" />
    <!-- Sci-Fi HUD Scanline on Face -->
    <line x1="55" y1="200" x2="345" y2="200" stroke="#00F0FF" stroke-width="1.5" opacity="0.6">
      <animate attributeName="y1" values="60;340;60" dur="4s" repeatCount="indefinite" />
      <animate attributeName="y2" values="60;340;60" dur="4s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Neon Portal Ring Encasing Revealed Face -->
  <circle cx="200" cy="200" r="146" fill="none" stroke="url(#spider-neon-rim)" stroke-width="3.5" filter="url(#hologram-glow)" />

  <!-- Outer Orbiting Particle Nodes (Three.js Hologram Effect) -->
  <g fill="#00F0FF" opacity="0.85">
    <circle cx="45" cy="140" r="3" filter="url(#eye-glow)" />
    <circle cx="85" cy="55" r="2.5" />
    <circle cx="315" cy="45" r="3" filter="url(#eye-glow)" />
    <circle cx="360" cy="130" r="2.5" />
    <circle cx="345" cy="280" r="2.5" />
    <circle cx="65" cy="270" r="3" />
  </g>
  <g fill="#FF0044" opacity="0.85">
    <circle cx="115" cy="35" r="2.5" />
    <circle cx="285" cy="30" r="2" />
    <circle cx="370" cy="210" r="3.5" filter="url(#eye-glow)" />
    <circle cx="40" cy="210" r="2.5" filter="url(#eye-glow)" />
    <circle cx="125" cy="360" r="3" />
    <circle cx="275" cy="360" r="2.5" />
  </g>

  <!-- Cyber Glitch Slices -->
  <rect x="35" y="145" width="28" height="2" fill="#00F0FF" opacity="0.8" />
  <rect x="335" y="210" width="30" height="2" fill="#FF0044" opacity="0.8" />
</svg>
