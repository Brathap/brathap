<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Outer Dark Realm -->
    <radialGradient id="portal-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A0210" />
      <stop offset="55%" stop-color="#0A0314" />
      <stop offset="85%" stop-color="#05020A" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Glowing Spider Mask Red Gradient -->
    <linearGradient id="mask-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A53" />
      <stop offset="50%" stop-color="#E60039" />
      <stop offset="100%" stop-color="#990022" />
    </linearGradient>

    <!-- Neon Rim Gradient -->
    <linearGradient id="neon-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0044" />
      <stop offset="50%" stop-color="#8A00FF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Intense Hologram Glow Filters -->
    <filter id="hologram-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="eye-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="eye-blur" />
      <feMerge>
        <feMergeNode in="eye-blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Outer Portal Frame -->
  <circle cx="200" cy="200" r="195" fill="url(#portal-bg)" stroke="url(#neon-rim)" stroke-width="3" filter="url(#hologram-glow)" />

  <!-- 3D Perspective Wireframe Web Rings (Spider-Sense Gyroscope) -->
  <g opacity="0.4" stroke="#FF0044" stroke-width="1.2" fill="none">
    <!-- Rotating Gyro Rings -->
    <ellipse cx="200" cy="200" rx="175" ry="175" stroke="#00F0FF" stroke-opacity="0.3" stroke-dasharray="10 14" />
    <ellipse cx="200" cy="200" rx="155" ry="70" stroke="#FF0044" stroke-opacity="0.5" stroke-dasharray="6 8">
      <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="20s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="200" cy="200" rx="155" ry="70" stroke="#00F0FF" stroke-opacity="0.4" stroke-dasharray="8 6">
      <animateTransform attributeName="transform" type="rotate" from="60 200 200" to="420 200 200" dur="25s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="200" cy="200" rx="155" ry="70" stroke="#8A00FF" stroke-opacity="0.4" stroke-dasharray="4 6">
      <animateTransform attributeName="transform" type="rotate" from="120 200 200" to="480 200 200" dur="18s" repeatCount="indefinite" />
    </ellipse>
  </g>

  <!-- Central Radial Web Strands -->
  <g stroke="#FF0044" stroke-opacity="0.3" stroke-width="1">
    <line x1="200" y1="200" x2="200" y2="25" />
    <line x1="200" y1="200" x2="325" y2="75" />
    <line x1="200" y1="200" x2="375" y2="200" />
    <line x1="200" y1="200" x2="325" y2="325" />
    <line x1="200" y1="200" x2="200" y2="375" />
    <line x1="200" y1="200" x2="75" y2="325" />
    <line x1="200" y1="200" x2="25" y2="200" />
    <line x1="200" y1="200" x2="75" y2="75" />
  </g>

  <!-- SPIDER-MAN 3D HEAD & MASK -->
  <g transform="translate(0, 5)">
    <!-- Head Base Silhouette -->
    <path d="M 200 68 C 145 68, 115 110, 115 175 C 115 235, 148 290, 200 318 C 252 290, 285 235, 285 175 C 285 110, 255 68, 200 68 Z" fill="url(#mask-red)" stroke="#FF0044" stroke-width="2.5" filter="url(#hologram-glow)" />

    <!-- Mask Web Line Coordinates (Spider Webbing on Face) -->
    <!-- Vertical Center Strand -->
    <path d="M 200 68 Q 200 190 200 318" stroke="#000000" stroke-width="2.2" opacity="0.75" />
    <!-- Outer Curved Facial Strands -->
    <path d="M 180 72 Q 155 180 178 308" stroke="#000000" stroke-width="1.8" opacity="0.65" />
    <path d="M 220 72 Q 245 180 222 308" stroke="#000000" stroke-width="1.8" opacity="0.65" />
    <path d="M 155 85 Q 128 175 160 295" stroke="#000000" stroke-width="1.5" opacity="0.6" />
    <path d="M 245 85 Q 272 175 240 295" stroke="#000000" stroke-width="1.5" opacity="0.6" />

    <!-- Horizontal Web Arcs on Mask -->
    <path d="M 172 102 Q 200 114 228 102" stroke="#000000" stroke-width="1.6" opacity="0.7" />
    <path d="M 150 128 Q 200 146 250 128" stroke="#000000" stroke-width="1.6" opacity="0.7" />
    <path d="M 140 155 Q 200 178 260 155" stroke="#000000" stroke-width="1.6" opacity="0.7" />
    <path d="M 140 225 Q 200 200 260 225" stroke="#000000" stroke-width="1.6" opacity="0.7" />
    <path d="M 152 258 Q 200 236 248 258" stroke="#000000" stroke-width="1.6" opacity="0.7" />
    <path d="M 175 288 Q 200 272 225 288" stroke="#000000" stroke-width="1.6" opacity="0.7" />

    <!-- GLOWING SPIDER-MAN EYES (Iconic Sharp Angled Lenses) -->
    <!-- Left Eye Black Border -->
    <path d="M 190 162 C 182 135, 148 138, 128 165 C 132 195, 168 220, 192 208 Z" fill="#000000" stroke="#00F0FF" stroke-width="2.5" />
    <!-- Left Eye Glowing White Lens -->
    <path d="M 186 164 C 180 142, 154 145, 137 167 C 140 190, 168 210, 188 202 Z" fill="#FFFFFF" filter="url(#eye-glow)" />

    <!-- Right Eye Black Border -->
    <path d="M 210 162 C 218 135, 252 138, 272 165 C 268 195, 232 220, 208 208 Z" fill="#000000" stroke="#00F0FF" stroke-width="2.5" />
    <!-- Right Eye Glowing White Lens -->
    <path d="M 214 164 C 220 142, 246 145, 263 167 C 260 190, 232 210, 212 202 Z" fill="#FFFFFF" filter="url(#eye-glow)" />
  </g>

  <!-- Outer Orbiting Particle Glyphs (Three.js Particle Cloud Effect) -->
  <g fill="#00F0FF" opacity="0.8">
    <circle cx="50" cy="140" r="2.5" />
    <circle cx="90" cy="60" r="2" />
    <circle cx="310" cy="50" r="3" filter="url(#eye-glow)" />
    <circle cx="355" cy="130" r="2.5" />
    <circle cx="340" cy="280" r="2" />
    <circle cx="70" cy="270" r="3" />
  </g>
  <g fill="#FF0044" opacity="0.8">
    <circle cx="120" cy="40" r="2.5" />
    <circle cx="280" cy="35" r="2" />
    <circle cx="365" cy="210" r="3" />
    <circle cx="45" cy="210" r="2.5" filter="url(#eye-glow)" />
    <circle cx="130" cy="355" r="3" />
    <circle cx="270" cy="355" r="2.5" />
  </g>

  <!-- Cyber Glitch Slices -->
  <rect x="90" y="145" width="22" height="2" fill="#00F0FF" opacity="0.75" />
  <rect x="290" y="210" width="25" height="2" fill="#FF0044" opacity="0.75" />
</svg>
