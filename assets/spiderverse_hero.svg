<svg width="900" height="180" viewBox="0 0 900 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="portal-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14030F" />
      <stop offset="60%" stop-color="#08020F" />
      <stop offset="100%" stop-color="#020005" />
    </radialGradient>

    <!-- Neon Crimson Drop Shadow -->
    <filter id="spider-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FF0044" flood-opacity="0.5" />
    </filter>

    <filter id="cyan-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00F0FF" flood-opacity="0.6" />
    </filter>

    <!-- Spider Suit Hexagonal Grid Mesh -->
    <pattern id="spider-mesh" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 16 4 L 16 12 L 8 16 L 0 12 L 0 4 Z" fill="none" stroke="#FF0044" stroke-width="0.6" stroke-opacity="0.18" />
    </pattern>
  </defs>

  <!-- Cyber Spider Outer Frame -->
  <rect x="3" y="3" width="894" height="174" rx="14" fill="url(#portal-bg)" stroke="#FF0044" stroke-width="1.8" filter="url(#spider-glow)" />

  <!-- Spider Suit Hex Grid Texture Layer -->
  <rect x="3" y="3" width="894" height="174" rx="14" fill="url(#spider-mesh)" />

  <!-- ============================================== -->
  <!-- 3D PERSPECTIVE SPIDER WEBS ACROSS THE ENTIRE UI -->
  <!-- ============================================== -->
  <!-- Left Web Network (Anchored at 0, 90) -->
  <g stroke="#FF0044" stroke-width="1" opacity="0.32" fill="none">
    <line x1="0" y1="90" x2="320" y2="0" />
    <line x1="0" y1="90" x2="260" y2="40" />
    <line x1="0" y1="90" x2="240" y2="90" stroke="#00F0FF" stroke-opacity="0.4" />
    <line x1="0" y1="90" x2="260" y2="140" />
    <line x1="0" y1="90" x2="320" y2="180" />
    <!-- Web Loops -->
    <path d="M 50 76 Q 70 90 50 104" />
    <path d="M 100 62 Q 135 90 100 118" />
    <path d="M 155 46 Q 200 90 155 134" stroke="#00F0FF" stroke-opacity="0.3" />
    <path d="M 210 32 Q 265 90 210 148" />
  </g>

  <!-- Right Web Network (Anchored at 900, 90) -->
  <g stroke="#FF0044" stroke-width="1" opacity="0.32" fill="none">
    <line x1="900" y1="90" x2="580" y2="0" />
    <line x1="900" y1="90" x2="640" y2="40" />
    <line x1="900" y1="90" x2="660" y2="90" stroke="#00F0FF" stroke-opacity="0.4" />
    <line x1="900" y1="90" x2="640" y2="140" />
    <line x1="900" y1="90" x2="580" y2="180" />
    <!-- Web Loops -->
    <path d="M 850 76 Q 830 90 850 104" />
    <path d="M 800 62 Q 765 90 800 118" />
    <path d="M 745 46 Q 700 90 745 134" stroke="#00F0FF" stroke-opacity="0.3" />
    <path d="M 690 32 Q 635 90 690 148" />
  </g>

  <!-- Glowing Spider-Sense Top Rail -->
  <path d="M 30 18 L 400 18 L 420 32 L 870 32" stroke="#00F0FF" stroke-width="1.8" opacity="0.7" fill="none" filter="url(#cyan-glow)" />
  <circle cx="30" cy="18" r="3.5" fill="#FF0044" />
  <circle cx="870" cy="32" r="3.5" fill="#00F0FF" />

  <!-- Glowing Cyber Spider Icon Crest -->
  <g transform="translate(60, 98) scale(0.95)" filter="url(#spider-glow)">
    <ellipse cx="0" cy="0" rx="7" ry="14" fill="#FF0044" />
    <ellipse cx="0" cy="-11" rx="5" ry="5.5" fill="#FF0044" />
    <path d="M -3 -6 Q -22 -24 -30 -44 Q -16 -26 -6 -13" fill="#FF0044" />
    <path d="M -5 -2 Q -28 -10 -36 -24 Q -22 -6 -8 -1" fill="#FF0044" />
    <path d="M -5 3 Q -28 15 -34 33 Q -20 15 -8 5" fill="#FF0044" />
    <path d="M -3 7 Q -22 28 -26 48 Q -14 30 -5 10" fill="#FF0044" />
    <path d="M 3 -6 Q 22 -24 30 -44 Q 16 -26 6 -13" fill="#FF0044" />
    <path d="M 5 -2 Q 28 -10 36 -24 Q 22 -6 8 -1" fill="#FF0044" />
    <path d="M 5 3 Q 28 15 34 33 Q 20 15 8 5" fill="#FF0044" />
    <path d="M 3 7 Q 22 28 26 48 Q 14 30 5 10" fill="#FF0044" />
  </g>

  <!-- ULTRA-SHARP NAME: BRATHAP S in PURE CRISP WHITE -->
  <text x="120" y="105" font-family="'Segoe UI', -apple-system, system-ui, sans-serif" font-size="52" font-weight="950" fill="#FFFFFF" letter-spacing="4px">BRATHAP S</text>

  <!-- Mission Subtitle -->
  <text x="122" y="136" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#FF0044" letter-spacing="2.5px">🕷️ FRIENDLY NEIGHBORHOOD ARCHITECT  //  EARTH-616</text>

  <!-- Vertical Web Strand Divider -->
  <line x1="630" y1="25" x2="630" y2="155" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="4 4" />

  <!-- Suit Telemetry Data Column -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">
    <text x="655" y="52" fill="#FF0044">SUIT:<tspan fill="#FFFFFF" font-weight="600"> SYMBIOTE-V3</tspan></text>
    <text x="655" y="74" fill="#00F0FF">CORE:<tspan fill="#FFFFFF" font-weight="600"> HYPRLAND-WAYLAND</tspan></text>
    <text x="655" y="96" fill="#00FFA3">LINK:<tspan fill="#FFFFFF" font-weight="600"> BASH // NEOVIM</tspan></text>
    <text x="655" y="118" fill="#9D00FF">STATUS:<tspan fill="#FFFFFF" font-weight="600"> OSCILLATING</tspan></text>
    <text x="655" y="140" fill="#00F0FF">DIMENSION:<tspan fill="#FFFFFF" font-weight="600"> EARTH-616</tspan></text>
  </g>
</svg>