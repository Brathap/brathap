<svg width="900" height="300" viewBox="0 0 900 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Space-Spider Gradient -->
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040208" />
      <stop offset="40%" stop-color="#0C0517" />
      <stop offset="75%" stop-color="#140410" />
      <stop offset="100%" stop-color="#020106" />
    </linearGradient>

    <!-- Crimson & Neon Blue Cyber Gradient -->
    <linearGradient id="neon-glitch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0044" />
      <stop offset="40%" stop-color="#8A00FF" />
      <stop offset="70%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00FFA3" />
    </linearGradient>

    <linearGradient id="spider-glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF0044" />
      <stop offset="100%" stop-color="#7B001F" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="intense-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="2" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-white { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 950; font-size: 56px; fill: #FFFFFF; letter-spacing: 5px; }
    .spidey-sub { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-weight: 700; font-size: 14px; fill: #FF0044; letter-spacing: 3px; }
    .strand-line { stroke: #FF0044; stroke-opacity: 0.22; stroke-width: 1; }
    .cyan-strand { stroke: #00F0FF; stroke-opacity: 0.22; stroke-width: 1; }
    .ring-poly { stroke: #FF0044; stroke-opacity: 0.25; stroke-width: 1.2; fill: none; }
    .cyan-ring { stroke: #00F0FF; stroke-opacity: 0.22; stroke-width: 1.2; fill: none; }
    .pulse-glow { animation: pulse 3s infinite alternate ease-in-out; }
    @keyframes pulse { 0% { opacity: 0.3; } 100% { opacity: 0.9; } }
  </style>

  <!-- Deep Cosmic Canvas Base -->
  <rect width="900" height="300" rx="18" fill="url(#cyber-bg)" stroke="#FF0044" stroke-width="1.8" stroke-opacity="0.6" />

  <!-- 3D PERSPECTIVE SPIDER-WEB MESH -->
  <g filter="url(#subtle-glow)">
    <!-- Converging 3D Web Lines into focal point (730, 150) -->
    <line x1="730" y1="150" x2="0" y2="0" class="strand-line" stroke-opacity="0.4" />
    <line x1="730" y1="150" x2="0" y2="75" class="strand-line" />
    <line x1="730" y1="150" x2="0" y2="150" class="cyan-strand" stroke-opacity="0.5" />
    <line x1="730" y1="150" x2="0" y2="225" class="strand-line" />
    <line x1="730" y1="150" x2="0" y2="300" class="strand-line" stroke-opacity="0.4" />

    <line x1="730" y1="150" x2="250" y2="0" class="cyan-strand" />
    <line x1="730" y1="150" x2="450" y2="0" class="strand-line" />
    <line x1="730" y1="150" x2="650" y2="0" class="strand-line" />
    <line x1="730" y1="150" x2="730" y2="0" class="cyan-strand" />
    <line x1="730" y1="150" x2="850" y2="0" class="strand-line" />
    <line x1="730" y1="150" x2="900" y2="60" class="strand-line" />
    <line x1="730" y1="150" x2="900" y2="150" class="cyan-strand" stroke-opacity="0.5" />
    <line x1="730" y1="150" x2="900" y2="240" class="strand-line" />
    <line x1="730" y1="150" x2="850" y2="300" class="strand-line" />
    <line x1="730" y1="150" x2="730" y2="300" class="cyan-strand" />
    <line x1="730" y1="150" x2="550" y2="300" class="strand-line" />
    <line x1="730" y1="150" x2="350" y2="300" class="strand-line" />
    <line x1="730" y1="150" x2="150" y2="300" class="cyan-strand" />

    <!-- 3D Concentric Geometric Web Rings with Perspective Scale -->
    <polygon points="690,150 700,120 730,110 760,120 770,150 760,180 730,190 700,180" class="ring-poly" stroke="#FF0044" stroke-opacity="0.6" />
    <polygon points="650,150 670,90 730,70 790,90 810,150 790,210 730,230 670,210" class="cyan-ring" stroke-opacity="0.5" />
    <polygon points="570,150 610,50 730,20 850,50 890,150 850,250 730,280 610,250" class="ring-poly" stroke-opacity="0.4" />
    <polygon points="460,150 530,0 730,-40 930,0 1000,150 930,300 730,340 530,300" class="cyan-ring" stroke-opacity="0.25" />
    <polygon points="320,150 430,-60 730,-120 1030,-60 1140,150 1030,360 730,420 430,360" class="ring-poly" stroke-opacity="0.15" />
  </g>

  <!-- Top Cyber Web-Shooter Neon Rail -->
  <path d="M 30 22 L 300 22 L 325 38 L 870 38" stroke="url(#neon-glitch)" stroke-width="2.2" fill="none" filter="url(#intense-glow)" />
  <circle cx="30" cy="22" r="4.5" fill="#FF0044" />
  <circle cx="870" cy="38" r="4.5" fill="#00F0FF" />

  <!-- Tag Pills: Earth-616 & Spider-Sense -->
  <rect x="42" y="52" width="165" height="25" rx="5" fill="#17040C" stroke="#FF0044" stroke-width="1.3" />
  <text x="52" y="69" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#FF0044">EARTH-616 // ARCH-OS</text>

  <!-- Pulsating Spider-Sense Core Indicator -->
  <circle cx="230" cy="64" r="5.5" fill="#00F0FF" filter="url(#intense-glow)">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" />
  </circle>
  <text x="246" y="69" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F0FF">SPIDER-SENSE // ONLINE</text>

  <!-- Glitch Red & Cyan Layer Behind Name -->
  <text x="44" y="142" class="title-white" fill="#FF0044" fill-opacity="0.8" filter="url(#intense-glow)">BRATHAP S</text>
  <text x="38" y="139" class="title-white" fill="#00F0FF" fill-opacity="0.5">BRATHAP S</text>
  <text x="40" y="140" class="title-white">BRATHAP S</text>

  <!-- Dynamic Mission Statement -->
  <text x="42" y="176" class="spidey-sub">🕷️ FRIENDLY NEIGHBORHOOD ARCHITECT  •  AI &amp; AUTONOMY</text>

  <!-- Chips / Tech Nodes -->
  <g transform="translate(42, 206)">
    <!-- Arch Linux Chip -->
    <rect x="0" y="0" width="138" height="34" rx="8" fill="#0C0E1A" stroke="#00F0FF" stroke-width="1.3" />
    <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F0FF">ARCH LINUX</text>

    <!-- Hyprland Chip -->
    <rect x="148" y="0" width="125" height="34" rx="8" fill="#17040C" stroke="#FF0044" stroke-width="1.3" />
    <text x="163" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FF0044">HYPRLAND</text>

    <!-- Neovim Chip -->
    <rect x="283" y="0" width="110" height="34" rx="8" fill="#0C0E1A" stroke="#00FFA3" stroke-width="1.3" />
    <text x="298" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00FFA3">NEOVIM</text>

    <!-- Autonomous AI Chip -->
    <rect x="403" y="0" width="155" height="34" rx="8" fill="#17040C" stroke="#FF0044" stroke-width="1.3" />
    <text x="418" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FF3366">AUTONOMOUS AI</text>

    <!-- Zero-Dependency Chip -->
    <rect x="568" y="0" width="180" height="34" rx="8" fill="#0C0E1A" stroke="#00F0FF" stroke-width="1.3" />
    <text x="581" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F0FF">ZERO-DEPENDENCY</text>
  </g>

  <!-- Detailed Neon Miles Morales / Spider-Man Emblem -->
  <g transform="translate(730, 150) scale(1.3)" filter="url(#intense-glow)">
    <!-- Spider Body Core -->
    <ellipse cx="0" cy="0" rx="9" ry="17" fill="url(#spider-glow-grad)" />
    <ellipse cx="0" cy="-14" rx="6" ry="6.5" fill="url(#spider-glow-grad)" />

    <!-- Spider Legs (Left) -->
    <path d="M -4 -8 Q -28 -30 -38 -56 Q -22 -34 -8 -17" fill="url(#spider-glow-grad)" />
    <path d="M -6 -3 Q -36 -14 -46 -30 Q -28 -9 -10 -2" fill="url(#spider-glow-grad)" />
    <path d="M -6 4 Q -36 19 -44 42 Q -26 19 -10 6" fill="url(#spider-glow-grad)" />
    <path d="M -4 9 Q -28 36 -34 62 Q -18 38 -6 13" fill="url(#spider-glow-grad)" />

    <!-- Spider Legs (Right) -->
    <path d="M 4 -8 Q 28 -30 38 -56 Q 22 -34 8 -17" fill="url(#spider-glow-grad)" />
    <path d="M 6 -3 Q 36 -14 46 -30 Q 28 -9 10 -2" fill="url(#spider-glow-grad)" />
    <path d="M 6 4 Q 36 19 44 42 Q 26 19 10 6" fill="url(#spider-glow-grad)" />
    <path d="M 4 9 Q 28 36 34 62 Q 18 38 6 13" fill="url(#spider-glow-grad)" />

    <!-- Sharp Glowing Cyber Eyes -->
    <polygon points="-4,-16 -1,-11 -5,-12" fill="#00F0FF" />
    <polygon points="4,-16 1,-11 5,-12" fill="#00F0FF" />
  </g>

  <!-- Neon Glitch Artifacts for Spider-Verse Aesthetic -->
  <rect x="715" y="112" width="30" height="2" fill="#00F0FF" opacity="0.9" />
  <rect x="745" y="185" width="24" height="2" fill="#FF0044" opacity="0.9" />
  <rect x="705" y="165" width="18" height="1.5" fill="#00FFA3" opacity="0.8" />
</svg>
