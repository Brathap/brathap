<svg width="900" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914" />
      <stop offset="50%" stop-color="#071326" />
      <stop offset="100%" stop-color="#02050B" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#00FFA3" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .header-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 52px; fill: #FFFFFF; letter-spacing: 5px; }
    .sub-text { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-weight: 600; font-size: 15px; fill: #00F0FF; letter-spacing: 3px; }
    .tag-box { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; fill: #A5B4FC; letter-spacing: 1px; }
    .border-line { stroke: url(#accent-cyan); stroke-width: 1.5; }
    .grid-line { stroke: #0E223D; stroke-width: 1; stroke-opacity: 0.4; }
  </style>

  <!-- Background Base -->
  <rect width="900" height="240" rx="16" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Background Cyber Grid -->
  <line x1="0" y1="60" x2="900" y2="60" class="grid-line" />
  <line x1="0" y1="120" x2="900" y2="120" class="grid-line" />
  <line x1="0" y1="180" x2="900" y2="180" class="grid-line" />
  <line x1="150" y1="0" x2="150" y2="240" class="grid-line" />
  <line x1="300" y1="0" x2="300" y2="240" class="grid-line" />
  <line x1="450" y1="0" x2="450" y2="240" class="grid-line" />
  <line x1="600" y1="0" x2="600" y2="240" class="grid-line" />
  <line x1="750" y1="0" x2="750" y2="240" class="grid-line" />

  <!-- Top Decorative Circuit Bar -->
  <path d="M 30 20 L 220 20 L 240 35 L 870 35" stroke="url(#accent-cyan)" stroke-width="2" fill="none" filter="url(#glow)" />
  <circle cx="30" cy="20" r="3.5" fill="#00F0FF" />
  <circle cx="870" cy="35" r="3.5" fill="#00FFA3" />

  <!-- Terminal Label -->
  <rect x="40" y="48" width="135" height="22" rx="4" fill="#0B192C" stroke="#00F0FF" stroke-width="1" />
  <text x="48" y="63" class="tag-box">SYS_ID // 0xBRATHAP</text>

  <!-- System Online Indicator -->
  <circle cx="195" cy="59" r="4.5" fill="#00FFA3" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="208" y="63" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00FFA3">CORE ONLINE</text>

  <!-- Main Headline -->
  <text x="40" y="125" class="header-text">BRATHAP S</text>

  <!-- Subtitle Tagline -->
  <text x="42" y="158" class="sub-text">⚡ SYSTEMS ARCHITECT  •  AI &amp; AUTONOMY ENGINEER</text>

  <!-- Bottom Badges / Tech Highlights -->
  <g transform="translate(42, 185)">
    <!-- Node 1 -->
    <rect x="0" y="0" width="125" height="28" rx="6" fill="#0F172A" stroke="#334155" />
    <text x="14" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#E2E8F0">ARCH LINUX</text>

    <!-- Node 2 -->
    <rect x="135" y="0" width="115" height="28" rx="6" fill="#0F172A" stroke="#334155" />
    <text x="150" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#E2E8F0">HYPRLAND</text>

    <!-- Node 3 -->
    <rect x="260" y="0" width="100" height="28" rx="6" fill="#0F172A" stroke="#334155" />
    <text x="276" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#E2E8F0">NEOVIM</text>

    <!-- Node 4 -->
    <rect x="370" y="0" width="135" height="28" rx="6" fill="#0F172A" stroke="#334155" />
    <text x="382" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#00F0FF">AGENTIC AI</text>

    <!-- Node 5 -->
    <rect x="515" y="0" width="165" height="28" rx="6" fill="#0F172A" stroke="#334155" />
    <text x="526" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#00FFA3">ZERO-DEPENDENCY</text>
  </g>

  <!-- Bottom Right Hexagon Icon -->
  <polygon points="840,165 860,177 860,200 840,212 820,200 820,177" fill="#0A192F" stroke="url(#accent-cyan)" stroke-width="1.5" />
  <text x="833" y="193" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#00F0FF">λ</text>
</svg>
