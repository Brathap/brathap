<svg width="900" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Space-Spider Gradient -->
    <linearGradient id="spider-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050A" />
      <stop offset="35%" stop-color="#0D091A" />
      <stop offset="70%" stop-color="#140812" />
      <stop offset="100%" stop-color="#020308" />
    </linearGradient>

    <!-- Crimson & Neon Blue Cyber Gradient -->
    <linearGradient id="spidey-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF003C" />
      <stop offset="50%" stop-color="#9D00FF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Spider Emblem Gradient -->
    <linearGradient id="emblem-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF1744" />
      <stop offset="100%" stop-color="#B7002C" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="web-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-glitch { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 950; font-size: 54px; fill: #FFFFFF; letter-spacing: 5px; }
    .spidey-sub { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-weight: 700; font-size: 14px; fill: #FF003C; letter-spacing: 3px; }
    .web-strand { stroke: #FF003C; stroke-opacity: 0.18; stroke-width: 1; }
    .web-ring { stroke: #00F0FF; stroke-opacity: 0.15; stroke-width: 1; fill: none; }
  </style>

  <!-- Dark Canvas Base -->
  <rect width="900" height="280" rx="16" fill="url(#spider-bg)" stroke="#FF003C" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- 3D Perspective Cyber-Web Mesh -->
  <g filter="url(#web-glow)">
    <!-- Radial Strands radiating from spider emblem -->
    <line x1="720" y1="140" x2="0" y2="0" class="web-strand" stroke-opacity="0.3" />
    <line x1="720" y1="140" x2="0" y2="70" class="web-strand" />
    <line x1="720" y1="140" x2="0" y2="140" class="web-strand" />
    <line x1="720" y1="140" x2="0" y2="210" class="web-strand" />
    <line x1="720" y1="140" x2="0" y2="280" class="web-strand" stroke-opacity="0.3" />

    <line x1="720" y1="140" x2="300" y2="0" class="web-strand" />
    <line x1="720" y1="140" x2="500" y2="0" class="web-strand" />
    <line x1="720" y1="140" x2="720" y2="0" class="web-strand" />
    <line x1="720" y1="140" x2="900" y2="30" class="web-strand" />
    <line x1="720" y1="140" x2="900" y2="140" class="web-strand" />
    <line x1="720" y1="140" x2="900" y2="250" class="web-strand" />
    <line x1="720" y1="140" x2="720" y2="280" class="web-strand" />
    <line x1="720" y1="140" x2="500" y2="280" class="web-strand" />
    <line x1="720" y1="140" x2="300" y2="280" class="web-strand" />

    <!-- Concentric Cyber Web Poly-Rings -->
    <polygon points="680,140 690,110 720,100 750,110 760,140 750,170 720,180 690,170" class="web-ring" stroke="#FF003C" stroke-opacity="0.4" />
    <polygon points="640,140 660,80 720,60 780,80 800,140 780,200 720,220 660,200" class="web-ring" />
    <polygon points="560,140 600,40 720,10 840,40 880,140 840,240 720,270 600,240" class="web-ring" stroke="#FF003C" stroke-opacity="0.3" />
    <polygon points="460,140 520,0 720,-40 920,0 980,140 920,280 720,320 520,280" class="web-ring" />
  </g>

  <!-- Top Cyber Spider-Tracer Circuit -->
  <path d="M 30 22 L 280 22 L 305 38 L 870 38" stroke="url(#spidey-neon)" stroke-width="2" fill="none" filter="url(#neon-glow)" />
  <circle cx="30" cy="22" r="4" fill="#FF003C" />
  <circle cx="870" cy="38" r="4" fill="#00F0FF" />

  <!-- Earth-616 Cyber Dimension Tag -->
  <rect x="42" y="48" width="160" height="24" rx="4" fill="#1A050B" stroke="#FF003C" stroke-width="1.2" />
  <text x="52" y="64" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#FF003C">EARTH-616 // ARCH-OS</text>

  <!-- Web-Sense Pulse Status -->
  <circle cx="225" cy="60" r="5" fill="#00F0FF" filter="url(#neon-glow)">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite" />
  </circle>
  <text x="240" y="64" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F0FF">SPIDER-SENSE ACTIVE</text>

  <!-- Glitch Under-glow Behind Name -->
  <text x="44" y="132" class="title-glitch" fill="#FF003C" fill-opacity="0.6" filter="url(#neon-glow)">BRATHAP S</text>
  <text x="40" y="130" class="title-glitch">BRATHAP S</text>

  <!-- Hero Subtitle -->
  <text x="42" y="165" class="spidey-sub">🕷️ FRIENDLY NEIGHBORHOOD ARCHITECT  •  AI &amp; SYSTEMS</text>

  <!-- System Badge Chips with Neon Accents -->
  <g transform="translate(42, 195)">
    <!-- Arch Linux Chip -->
    <rect x="0" y="0" width="135" height="32" rx="7" fill="#0F111D" stroke="#00F0FF" stroke-width="1.2" />
    <text x="14" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F0FF">ARCH LINUX</text>

    <!-- Hyprland Chip -->
    <rect x="145" y="0" width="120" height="32" rx="7" fill="#140812" stroke="#FF003C" stroke-width="1.2" />
    <text x="160" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FF003C">HYPRLAND</text>

    <!-- Neovim Chip -->
    <rect x="275" y="0" width="105" height="32" rx="7" fill="#0F111D" stroke="#00FFA3" stroke-width="1.2" />
    <text x="290" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00FFA3">NEOVIM</text>

    <!-- Autonomous AI Chip -->
    <rect x="390" y="0" width="145" height="32" rx="7" fill="#140812" stroke="#FF003C" stroke-width="1.2" />
    <text x="405" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FF3366">AUTONOMOUS AI</text>

    <!-- Zero-Dependency Chip -->
    <rect x="545" y="0" width="175" height="32" rx="7" fill="#0F111D" stroke="#00F0FF" stroke-width="1.2" />
    <text x="558" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F0FF">ZERO-DEPENDENCY</text>
  </g>

  <!-- Detailed Spider-Man Emblem on the right -->
  <g transform="translate(720, 140) scale(1.15)">
    <!-- Spider Body Core -->
    <ellipse cx="0" cy="0" rx="9" ry="16" fill="url(#emblem-grad)" filter="url(#neon-glow)" />
    <ellipse cx="0" cy="-14" rx="6" ry="6" fill="url(#emblem-grad)" />

    <!-- Upper Legs (Left) -->
    <path d="M -4 -8 Q -28 -28 -38 -52 Q -22 -32 -8 -16" fill="url(#emblem-grad)" />
    <path d="M -6 -3 Q -34 -12 -44 -28 Q -28 -8 -10 -2" fill="url(#emblem-grad)" />

    <!-- Lower Legs (Left) -->
    <path d="M -6 4 Q -35 18 -42 38 Q -26 18 -10 6" fill="url(#emblem-grad)" />
    <path d="M -4 9 Q -26 34 -32 58 Q -18 36 -6 12" fill="url(#emblem-grad)" />

    <!-- Upper Legs (Right) -->
    <path d="M 4 -8 Q 28 -28 38 -52 Q 22 -32 8 -16" fill="url(#emblem-grad)" />
    <path d="M 6 -3 Q 34 -12 44 -28 Q 28 -8 10 -2" fill="url(#emblem-grad)" />

    <!-- Lower Legs (Right) -->
    <path d="M 6 4 Q 35 18 42 38 Q 26 18 10 6" fill="url(#emblem-grad)" />
    <path d="M 4 9 Q 26 34 32 58 Q 18 36 6 12" fill="url(#emblem-grad)" />

    <!-- Spider Eyes with Blue Glow -->
    <path d="M -4 -16 L -1 -12 L -5 -12 Z" fill="#00F0FF" filter="url(#neon-glow)" />
    <path d="M 4 -16 L 1 -12 L 5 -12 Z" fill="#00F0FF" filter="url(#neon-glow)" />
  </g>

  <!-- Spider-Verse Cyan Glitch Slice -->
  <rect x="710" y="105" width="22" height="2" fill="#00F0FF" opacity="0.8" />
  <rect x="735" y="170" width="18" height="2" fill="#00F0FF" opacity="0.8" />
</svg>
