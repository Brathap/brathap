<svg width="900" height="180" viewBox="0 0 900 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020106" />
      <stop offset="50%" stop-color="#0F0514" />
      <stop offset="100%" stop-color="#050B14" />
    </linearGradient>
    <linearGradient id="neon-glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0044" />
      <stop offset="50%" stop-color="#8A00FF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="f-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="900" height="180" rx="16" fill="url(#footer-bg)" stroke="#FF0044" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Top Accent Rail -->
  <line x1="30" y1="18" x2="870" y2="18" stroke="url(#neon-glow-line)" stroke-width="2" filter="url(#f-glow)" />

  <!-- Spider Web Floor Graphic -->
  <path d="M 0 180 Q 450 60 900 180" stroke="#FF0044" stroke-opacity="0.2" stroke-width="1.5" fill="none" />
  <path d="M 150 180 Q 450 100 750 180" stroke="#00F0FF" stroke-opacity="0.15" stroke-width="1.2" fill="none" />
  <line x1="450" y1="18" x2="450" y2="180" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="1" />
  <line x1="250" y1="18" x2="450" y2="180" stroke="#FF0044" stroke-opacity="0.15" stroke-width="1" />
  <line x1="650" y1="18" x2="450" y2="180" stroke="#FF0044" stroke-opacity="0.15" stroke-width="1" />

  <!-- Centered Iconic Quote -->
  <text x="450" y="70" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" letter-spacing="4" filter="url(#f-glow)">
    &quot;WITH GREAT ARCHITECTURAL POWER COMES GREAT CODE RESPONSIBILITY&quot;
  </text>

  <!-- Subtitle Tagline -->
  <text x="450" y="105" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" fill="#00F0FF" letter-spacing="3">
    ⚡ EARTH-616 // WEAVING AUTONOMOUS SYSTEMS &amp; DISTRIBUTED PROTOCOLS
  </text>

  <!-- Hanging Spider Insignia -->
  <g transform="translate(450, 142) scale(0.65)">
    <line x1="0" y1="-30" x2="0" y2="0" stroke="#00F0FF" stroke-width="2" />
    <circle cx="0" cy="0" r="10" fill="#FF0044" filter="url(#f-glow)" />
    <polygon points="-4,-3 0,4 4,-3" fill="#FFFFFF" />
  </g>
</svg>
